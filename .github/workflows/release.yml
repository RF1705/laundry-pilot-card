name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for latest)
        required: false
        type: string

permissions:
  contents: write

jobs:
  upload-card:
    name: Attach card JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$release_tag" ]; then
            release_tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Validate and attach card
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --check laundry-pilot-card.js
          gh release upload --clobber -- "$RELEASE_TAG" laundry-pilot-card.js
